# This config file is used by ros2_control
controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController


    gripper_controller:
      type: position_controllers/GripperActionController


    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

arm_controller:
  ros__parameters:
    joints:
      - joint1
      - joint2
      - joint3
      - joint4
      - joint5
      - joint6
    # 只占用五个 MIT 接口中的两个；kp/kd 使用 URDF 初值，effort 为额外前馈。
    command_interfaces: [position, velocity]
    state_interfaces: [position, velocity]
gripper_controller:
  ros__parameters:
    joint: finger_left
    goal_tolerance: 0.0001  # m，米制接口下的到位容差
    stall_velocity_threshold: 0.0001  # m/s

# 发布六轴角度和已换算的 finger_left；finger_right 由 URDF mimic 跟随。
joint_state_broadcaster:
  ros__parameters:
    joints: [joint1, joint2, joint3, joint4, joint5, joint6, finger_left]
    interfaces: [position, velocity, effort]
