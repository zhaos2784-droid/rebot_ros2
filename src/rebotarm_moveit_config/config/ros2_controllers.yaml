# This config file is used by ros2_control
controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController


    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

arm_controller:
  ros__parameters:
    joints:
      - joint1
      - joint2
      - joint3
      - joint4
      - joint5
      - joint6
    # 只占用五个 MIT 接口中的两个；kp/kd 使用 URDF 初值，effort 为额外前馈。
    command_interfaces: [position, velocity]
    state_interfaces: [position, velocity]

# /joint_states 只发布运动学模型中存在的机械臂关节。
# gripper 是原始旋转电机，不是 finger_left/right 的米制手指关节，不能直接改名映射。
joint_state_broadcaster:
  ros__parameters:
    joints: [joint1, joint2, joint3, joint4, joint5, joint6]
    interfaces: [position, velocity, effort]

